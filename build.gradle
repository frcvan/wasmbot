import com.vanniktech.maven.publish.GradlePlugin
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar

plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id "com.diffplug.spotless" version "8.6.0"
    id 'com.gradle.plugin-publish' version '2.2.1'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'org.teamvan.wasmbot'
version = providers.gradleProperty('releaseVersion').getOrElse('0.1.0')
description = 'Source-bundled WPILib runtime and tooling for GraalVM Web Image.'

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation localGroovy()
    implementation 'org.graalvm.buildtools:native-gradle-plugin:1.1.14'
    implementation 'org.ow2.asm:asm:9.9.1'
}

gradlePlugin {
    website = 'https://github.com/frcvan/wasmbot'
    vcsUrl = 'https://github.com/frcvan/wasmbot.git'
    plugins {
        wasmbot {
            id = 'org.teamvan.wasmbot'
            implementationClass = 'org.teamvan.wasmbot.plugin.WasmbotBuildPlugin'
            displayName = 'Wasmbot'
            description = project.description
            tags = [
                'frc',
                'wpilib',
                'webassembly',
                'graalvm',
                'simulation'
            ]
        }
    }
}

// The plugin's API is Groovy, so ship Groovydoc in the generated Javadoc artifact.
tasks.matching { it.name == 'javadocJar' }.configureEach {
    from(tasks.named('groovydoc'))
}

// Javadoc and sources jars are produced by java-gradle-plugin and the Gradle plugin publishing
// plugin; only POM metadata is configured here. Publishing itself is handled by publishPlugins
// (Gradle Plugin Portal) and publishAndReleaseToMavenCentral (Maven Central).
publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'Wasmbot'
            description = project.description
            url = 'https://github.com/frcvan/wasmbot'
            inceptionYear = '2026'
            licenses {
                license {
                    name = 'MIT License'
                    url = 'https://opensource.org/license/mit/'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'frcvan'
                    name = 'Team V.A.N.'
                    url = 'https://github.com/frcvan'
                }
            }
            scm {
                url = 'https://github.com/frcvan/wasmbot'
                connection = 'scm:git:https://github.com/frcvan/wasmbot.git'
                developerConnection = 'scm:git:ssh://git@github.com/frcvan/wasmbot.git'
            }
        }
    }
}

// Publish the same plugin artifacts to Maven Central in addition to the Gradle Plugin Portal.
mavenPublishing {
    configure(new GradlePlugin(new JavadocJar.None(), new SourcesJar.Sources()))
    publishToMavenCentral()
    // Tagged releases require signing; local development publications do not.
    if (providers.gradleProperty('releaseVersion').isPresent()) {
        signAllPublications()
    }
}

// Runtime sources are deliberately not part of this build's Java source sets:
// the consuming robot compiles them against its own WPILib and vendor versions.
def buildLite = tasks.register('buildLite', Exec) {
    group = 'WASM'
    description = 'Builds the trimmed AdvantageScope Lite frontend bundled in the plugin JAR.'
    workingDir(projectDir)
    commandLine('node', 'ascope/buildLite.mjs')
    inputs.file(layout.projectDirectory.file('ascope/buildLite.mjs'))
    inputs.file(layout.projectDirectory.file('ascope/NT4.ts'))
    outputs.dir('ascope/build/lite/wasmbot')
}

def bundleWasmLibrary = tasks.register('bundleWasmLibrary', Zip) {
    description = 'Bundles the reusable runtime sources, smoke sources, frontend, and tools.'
    archiveFileName = 'library.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/wasm-library')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.FAIL

    from('src/runtime/java') { into 'runtime/java' }
    from('src/runtime/advantagekit/java') { into 'advantagekit/java' }
    from('src/runtime/resources') { into 'runtime/resources' }
    from('src/smoke/java') { into 'tests/java' }
    from('shim') { into 'shim' }
    from('tools') { into 'tools' }
    from('AdvantageKit-LICENSE') { into 'licenses' }
    from('WPILib-License.md') { into 'licenses' }
    from('ascope/build/lite/wasmbot') { into 'web/advantagescope' }
    dependsOn(buildLite)
}

tasks.named('processResources') {
    from(bundleWasmLibrary.flatMap { it.archiveFile }) {
        into 'org/teamvan/wasmbot/plugin'
    }
}

// Maven Central enforces a monthly release-size quota shared by every release published that month.
// The bundled frontend dominates this JAR, so fail a release build that regresses its size instead
// of silently eating the quota; see PUBLISH.md.
def maxPluginJarBytes = 30L * 1024 * 1024
tasks.named('jar') {
    doLast {
        long size = archiveFile.get().asFile.length()
        String sizeMb = String.format('%.1f', size / 1024 / 1024)
        if (size > maxPluginJarBytes) {
            String message = "Plugin JAR is ${sizeMb} MB; release artifacts must stay under 30 MB."
            if (providers.gradleProperty('releaseVersion').isPresent()) {
                throw new GradleException(message)
            }
            logger.warn(message)
        } else {
            logger.lifecycle("Plugin JAR size: ${sizeMb} MB")
        }
    }
}

// Spotless formatting
project.compileJava.dependsOn(spotlessApply)
spotless {
    java {
        target fileTree(".") {
            include "**/*.java"
            exclude "**/build/**", "**/build-*/**"
        }
        toggleOffOn()
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target fileTree(".") {
            include "**/*.gradle"
            exclude "**/build/**", "**/build-*/**"
        }
        greclipse()
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
    json {
        target fileTree(".") {
            include "**/*.json"
            exclude "**/build/**", "**/build-*/**", ".wpilib/**", "ascope/.npm-cache/**"
        }
        gson().indentWithSpaces(2)
    }
    format "misc", {
        target fileTree(".") {
            include "**/*.md", "**/.gitignore"
            exclude "**/build/**", "**/build-*/**", "ascope/.npm-cache/**"
        }
        trimTrailingWhitespace()
        leadingTabsToSpaces(2)
        endWithNewline()
    }
}
