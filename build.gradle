import com.vanniktech.maven.publish.GradlePlugin
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar

plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id "com.diffplug.spotless" version "8.6.0"
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'org.teamvan.wasmbot'
version = providers.gradleProperty('releaseVersion').getOrElse('0.1.0')
description = 'Source-bundled WPILib runtime and tooling for GraalVM Web Image.'

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation localGroovy()
    implementation 'org.graalvm.buildtools:native-gradle-plugin:1.1.14'
}

gradlePlugin {
    plugins {
        wasmbot {
            id = 'org.teamvan.wasmbot'
            implementationClass = 'org.teamvan.wasmbot.plugin.WasmbotBuildPlugin'
            displayName = 'Wasmbot'
            description = project.description
        }
    }
}

def groovydocJar = tasks.register('groovydocJar', Jar) {
    archiveClassifier = 'javadoc'
    from(tasks.named('groovydoc'))
}

mavenPublishing {
    configure(new GradlePlugin(new JavadocJar.None(), new SourcesJar.Sources()))
    publishToMavenCentral()
    // Tagged releases require signing; local development publications do not.
    if (providers.gradleProperty('releaseVersion').isPresent()) {
        signAllPublications()
    }
    pom {
        name = 'Wasmbot'
        description = project.description
        url = 'https://github.com/frcvan/wasmbot'
        inceptionYear = '2026'
        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/license/mit/'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'frcvan'
                name = 'Team V.A.N.'
                url = 'https://github.com/frcvan'
            }
        }
        scm {
            url = 'https://github.com/frcvan/wasmbot'
            connection = 'scm:git:https://github.com/frcvan/wasmbot.git'
            developerConnection = 'scm:git:ssh://git@github.com/frcvan/wasmbot.git'
        }
    }
}

publishing.publications.withType(MavenPublication).configureEach {
    if (name == 'pluginMaven') {
        artifact(groovydocJar)
    }
}

// Runtime sources are deliberately not part of this build's Java source sets:
// the consuming robot compiles them against its own WPILib and vendor versions.
def buildLite = tasks.register('buildLite', Exec) {
    group = 'WASM'
    description = 'Builds the bundled AdvantageScope Lite frontend.'
    workingDir(projectDir)
    commandLine('node', 'akit/buildLite.mjs')
    inputs.files('akit/buildLite.mjs', 'akit/NT4.ts')
    outputs.dir('akit/build/lite/static')
}

def bundleWasmLibrary = tasks.register('bundleWasmLibrary', Zip) {
    description = 'Bundles the reusable runtime sources, smoke sources, frontend, and tools.'
    archiveFileName = 'library.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/wasm-library')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.FAIL

    from('src/runtime/java') { into 'runtime/java' }
    from('src/runtime/resources') { into 'runtime/resources' }
    from('src/smoke/java') { into 'tests/java' }
    from('shim') { into 'shim' }
    from('tools') { into 'tools' }
    from('WPILib-License.md') { into 'licenses' }
    from('akit/build/lite/static') { into 'web/advantagescope' }
    dependsOn(buildLite)
}

tasks.named('processResources') {
    from(bundleWasmLibrary.flatMap { it.archiveFile }) {
        into 'org/teamvan/wasmbot/plugin'
    }
}

// Spotless formatting
project.compileJava.dependsOn(spotlessApply)
spotless {
    java {
        target fileTree(".") {
            include "**/*.java"
            exclude "**/build/**", "**/build-*/**"
        }
        toggleOffOn()
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target fileTree(".") {
            include "**/*.gradle"
            exclude "**/build/**", "**/build-*/**"
        }
        greclipse()
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
    json {
        target fileTree(".") {
            include "**/*.json"
            exclude "**/build/**", "**/build-*/**", ".wpilib/**"
        }
        gson().indentWithSpaces(2)
    }
    format "misc", {
        target fileTree(".") {
            include "**/*.md", "**/.gitignore"
            exclude "**/build/**", "**/build-*/**"
        }
        trimTrailingWhitespace()
        leadingTabsToSpaces(2)
        endWithNewline()
    }
}
