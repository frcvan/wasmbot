plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id "com.diffplug.spotless" version "8.6.0"
    id 'com.gradle.plugin-publish' version '2.2.1'
}

group = 'org.teamvan.wasmbot'
version = providers.gradleProperty('releaseVersion').getOrElse('0.1.0')
description = 'Source-bundled WPILib runtime and tooling for GraalVM Web Image.'

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation localGroovy()
    implementation 'org.graalvm.buildtools:native-gradle-plugin:1.1.14'
    implementation 'org.ow2.asm:asm:9.9.1'
}

gradlePlugin {
    website = 'https://github.com/frcvan/wasmbot'
    vcsUrl = 'https://github.com/frcvan/wasmbot.git'
    plugins {
        wasmbot {
            id = 'org.teamvan.wasmbot'
            implementationClass = 'org.teamvan.wasmbot.plugin.WasmbotBuildPlugin'
            displayName = 'Wasmbot'
            description = project.description
            tags = [
                'frc',
                'wpilib',
                'webassembly',
                'graalvm',
                'simulation'
            ]
        }
    }
}

// The plugin's API is Groovy, so ship Groovydoc in the generated Javadoc artifact.
tasks.matching { it.name == 'javadocJar' }.configureEach {
    from(tasks.named('groovydoc'))
}

// The Plugin Portal supplies the plugin marker and Javadoc/sources jars; only POM metadata is
// configured here. Publishing itself is handled by publishPlugins.
publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'Wasmbot'
            description = project.description
            url = 'https://github.com/frcvan/wasmbot'
            inceptionYear = '2026'
            licenses {
                license {
                    name = 'MIT License'
                    url = 'https://opensource.org/license/mit/'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'frcvan'
                    name = 'Team V.A.N.'
                    url = 'https://github.com/frcvan'
                }
            }
            scm {
                url = 'https://github.com/frcvan/wasmbot'
                connection = 'scm:git:https://github.com/frcvan/wasmbot.git'
                developerConnection = 'scm:git:ssh://git@github.com/frcvan/wasmbot.git'
            }
        }
    }
}

// Runtime sources are deliberately not part of this build's Java source sets:
// the consuming robot compiles them against its own WPILib and vendor versions.
def buildLite = tasks.register('buildLite', Exec) {
    group = 'WASM'
    description = 'Builds the bundled AdvantageScope Lite frontend. Use -PskipDocs=true to omit docs.'
    workingDir(projectDir)
    commandLine('node', 'ascope/buildLite.mjs')
    inputs.file(layout.projectDirectory.file('ascope/buildLite.mjs'))
    inputs.file(layout.projectDirectory.file('ascope/NT4.ts'))
    def skipDocs = providers.gradleProperty('skipDocs').map { it.toBoolean() }.orElse(false)
    inputs.property('skipDocs', skipDocs)
    doFirst {
        environment('WASMBOT_SKIP_DOCS', skipDocs.get().toString())
    }
    outputs.dir('ascope/build/lite/static')
}

def bundleWasmLibrary = tasks.register('bundleWasmLibrary', Zip) {
    description = 'Bundles the reusable runtime sources, smoke sources, frontend, and tools.'
    archiveFileName = 'library.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/wasm-library')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.FAIL

    from('src/runtime/java') { into 'runtime/java' }
    from('src/runtime/advantagekit/java') { into 'advantagekit/java' }
    from('src/runtime/resources') { into 'runtime/resources' }
    from('src/smoke/java') { into 'tests/java' }
    from('shim') { into 'shim' }
    from('tools') { into 'tools' }
    from('AdvantageKit-LICENSE') { into 'licenses' }
    from('WPILib-License.md') { into 'licenses' }
    from('ascope/build/lite/static') { into 'web/advantagescope' }
    dependsOn(buildLite)
}

tasks.named('processResources') {
    from(bundleWasmLibrary.flatMap { it.archiveFile }) {
        into 'org/teamvan/wasmbot/plugin'
    }
}

// Spotless formatting
project.compileJava.dependsOn(spotlessApply)
spotless {
    java {
        target fileTree(".") {
            include "**/*.java"
            exclude "**/build/**", "**/build-*/**"
        }
        toggleOffOn()
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target fileTree(".") {
            include "**/*.gradle"
            exclude "**/build/**", "**/build-*/**"
        }
        greclipse()
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
    json {
        target fileTree(".") {
            include "**/*.json"
            exclude "**/build/**", "**/build-*/**", ".wpilib/**", "ascope/.npm-cache/**"
        }
        gson().indentWithSpaces(2)
    }
    format "misc", {
        target fileTree(".") {
            include "**/*.md", "**/.gitignore"
            exclude "**/build/**", "**/build-*/**", "ascope/.npm-cache/**"
        }
        trimTrailingWhitespace()
        leadingTabsToSpaces(2)
        endWithNewline()
    }
}
