name: Publish WASM example to GitHub Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Cache AdvantageScope npm packages
              uses: actions/cache@v4
              with:
                  path: akit/.npm-cache
                  key: ${{ runner.os }}-advantage-scope-npm-e28580467
                  restore-keys: |
                      ${{ runner.os }}-advantage-scope-npm-

            - name: Set up Binaryen
              shell: bash
              run: |
                  set -euo pipefail
                  version="version_133"
                  archive="binaryen-${version}-x86_64-linux.tar.gz"
                  url="https://github.com/WebAssembly/binaryen/releases/download/${version}/${archive}"
                  curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${archive}" "${url}"
                  mkdir -p "${RUNNER_TEMP}/binaryen"
                  tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}/binaryen" --strip-components=1
                  echo "${RUNNER_TEMP}/binaryen/bin" >> "${GITHUB_PATH}"

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Set up Emscripten
              uses: mymindstorm/setup-emsdk@v14
              with:
                  version: "4.0.12"

            - name: Set up JDK 25
              uses: actions/setup-java@v6
              with:
                  distribution: graalvm
                  java-version: "25"

            - name: Set up Gradle 9.4.1
              uses: gradle/actions/setup-gradle@v6
              with:
                  gradle-version: "9.4.1"

            - name: Publish the plugin to the local Maven repository
              run: gradle --no-daemon publishToMavenLocal -x spotlessCheck -x spotlessApply

            - name: Build the example site
              run: gradle --no-daemon -p examples/drivetrain wasmSite advantagescope

            - name: Configure Pages
              uses: actions/configure-pages@v5

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: examples/drivetrain/build/wasm/site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
