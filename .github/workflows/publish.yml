name: Publish to Gradle Plugin Portal

on:
    create:

permissions:
    contents: read

concurrency:
    group: gradle-plugin-portal-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        if: github.event.ref_type == 'tag'
        runs-on: ubuntu-latest
        steps:
            - name: Check out the tagged commit
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - name: Cache AdvantageScope npm packages
              uses: actions/cache@v4
              with:
                  path: ascope/.npm-cache
                  key: ${{ runner.os }}-advantage-scope-npm-e28580467
                  restore-keys: |
                      ${{ runner.os }}-advantage-scope-npm-
            - name: Set up Binaryen
              shell: bash
              run: |
                  set -euo pipefail
                  version="version_133"
                  archive="binaryen-${version}-x86_64-linux.tar.gz"
                  url="https://github.com/WebAssembly/binaryen/releases/download/${version}/${archive}"
                  curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${archive}" "${url}"
                  mkdir -p "${RUNNER_TEMP}/binaryen"
                  tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}/binaryen" --strip-components=1
                  echo "${RUNNER_TEMP}/binaryen/bin" >> "${GITHUB_PATH}"
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - name: Set up Emscripten
              uses: mymindstorm/setup-emsdk@v14
              with:
                  version: "4.0.12"
            - name: Set up JDK 25
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "25"
            - name: Set up Gradle 9.4.1
              uses: gradle/actions/setup-gradle@v6
              with:
                  gradle-version: "9.4.1"
            - name: Check and publish to the Gradle Plugin Portal
              shell: bash
              env:
                  RELEASE_TAG: ${{ github.event.ref }}
                  GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
                  GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
              run: gradle --no-daemon check publishPlugins -PreleaseVersion="${RELEASE_TAG#v}" -x spotlessCheck -x spotlessApply
