name: Publish to Maven Central

on:
    create:

permissions:
    contents: read

concurrency:
    group: maven-central-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        if: github.event.ref_type == 'tag'
        runs-on: ubuntu-latest
        steps:
            - name: Check out the tagged commit
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - name: Set up Emscripten
              uses: mymindstorm/setup-emsdk@v14
              with:
                  version: "4.0.12"
            - name: Set up JDK 25
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "25"
            - name: Set up Gradle 9.4.1
              uses: gradle/actions/setup-gradle@v6
              with:
                  gradle-version: "9.4.1"
            - name: Check, sign, publish, and release to Maven Central
              shell: bash
              env:
                  RELEASE_TAG: ${{ github.event.ref }}
                  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
                  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
                  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
                  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
              run: gradle --no-daemon check publishAndReleaseToMavenCentral -PreleaseVersion="${RELEASE_TAG#v}"
